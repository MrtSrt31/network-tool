[package]
name = "network-tool"
version = "0.1.0"
edition = "2021"
description = "Network Tool — authorized wireless security assessment platform: engagement intake, findings, remediation retest, and reporting (GUI + CLI)."
authors = ["Aturc"]

[[bin]]
name = "networktool"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tiny_http = "0.12"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
sha2 = "0.10"
log = { version = "0.4", features = ["std"] }
argon2 = "0.5"
aes-gcm = "0.10"
zeroize = "1"
getrandom = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true
